apiVersion: 1

apps:
  - type: 'velodb-doris-app'
    org_id: 1
    org_name: 'velodb'
    disabled: false
    pinned: true
    jsonData:
      apiUrl: http://default-url.com
      logsConfig:
        datasource: velodb-doris-sso
        database: otel
        logsTable: otel_logs
        targetTraceTable: otel_logs
        applicationAttributeKey: app
    secureJsonData:
      apiKey: secret-key
